packages:
  - web
  - shared

# Every dependency version lives in the catalog below; a package.json names
# it with `catalog:`. Strict mode makes `pnpm add` refuse any other version.
catalogMode: strict
catalogPrune: true

# The component library ships to GitHub Packages. The token stays in
# ~/.npmrc or ~/.config/pnpm/auth.ini, never in this repository.
registries:
  "@eshelton328": https://npm.pkg.github.com

allowBuilds:
  "@parcel/watcher": true
  esbuild: true

catalog:
  "@eshelton328/component-library-1701": 1.0.0-beta.15
  "@fontsource-variable/geist": 5.3.0
  "@fontsource-variable/geist-mono": 5.3.0
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": 24.19.2
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.169.0
  "@tanstack/router-generator": 1.168.0
  "@tanstack/eslint-plugin-router": 1.162.0
  zustand: 5.1.0
  react-error-boundary: 6.1.6
  zod: 4.6.7
  "@pandacss/dev": 2.5.0
  "@pandacss/eslint-plugin": 2.5.0
  "@pandacss/preset-base": 2.5.0
  vite: 8.3.8
  "@vitejs/plugin-react": 6.3.0
  vitest: 5.1.0
  "@vitest/browser": 5.1.0
  "@vitest/browser-playwright": 5.1.0
  playwright: 1.65.1
  storybook: 10.6.7
  "@storybook/react-vite": 10.6.7
  "@storybook/addon-a11y": 10.6.7
  "@storybook/addon-vitest": 10.6.7
  typescript: 6.0.3
  eslint: 10.15.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.72.2
  "@eslint-community/eslint-plugin-eslint-comments": 4.8.1
  "@eslint-react/eslint-plugin": 5.30.3
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-storybook: 10.6.7
  eslint-plugin-boundaries: 7.4.4
  eslint-plugin-check-file: 3.3.2
  globals: 17.14.0
  knip: 6.45.1
  "@biomejs/biome": 2.6.8

minimumReleaseAgeExclude:
  - "@eshelton328/component-library-1701@1.0.0-beta.15"
