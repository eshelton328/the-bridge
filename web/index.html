    <script id="color-mode">
      // The saved colour mode before the first paint (d-119; app/colorMode.ts keeps it after). It reads only the
      // settings key; a missing or bad value, or blocked storage, keeps Dark, the class above. The theme-color, which
      // colours the iOS status bar, takes the mode's bg.canvas from the meta's copies (app/manifest.test.ts checks them).
      try {
        var mode = JSON.parse(localStorage.getItem('bridge/settings')).mode
        var dark = mode === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : mode !== 'light'
        document.documentElement.classList.toggle('dark', dark)
        var theme = document.querySelector('meta[name="theme-color"]')
        theme.setAttribute('content', theme.getAttribute(dark ? 'data-dark' : 'data-light'))
      } catch (e) {}
    </script>

       * fg.muted and bodySm (its base text size) for the late line, kindTile.sm for the mark, spacing 16, and duration.shimmer and
       * easing.shimmer for the glow's breath. The layout widths are viewport.ts's (shell.listPane 420,
       * rail + listPane + detail 1232). app/LaunchView.test.tsx fails when a copy drifts from its token. The iOS
