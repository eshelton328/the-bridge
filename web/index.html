<!doctype html>
<html lang="en" class="dark" data-panda-theme="viewscreen">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>The Bridge</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="The Bridge" />
    <script id="color-mode">
      // The saved colour mode before the first paint (d-119; app/colorMode.ts keeps it after). It reads only the
      // settings key; a missing or bad value, or blocked storage, keeps Dark, the class above.
      try {
        var mode = JSON.parse(localStorage.getItem('bridge/settings')).mode
        var dark = mode === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : mode !== 'light'
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
