# Generated by the actions-minutes skill in the brain (scripts/render-workflow
# from the project facts); edit the facts or the skill, then render again.
# On its schedule it counts this repository's Actions spend in USD for the month
# to date from the runs and jobs API and opens, updates or closes the issue
# "Actions spend at a monthly alert level".
name: actions-minutes

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

concurrency:
  group: actions-minutes
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Restore the ledger of counted days
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: actions-minutes-ledger.json
          key: actions-minutes-${{ github.run_id }}
          restore-keys: actions-minutes-

      - name: Count the minutes and update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/minutes" <<'MINUTES'
          #!/usr/bin/env python3
          """minutes: counts billed GitHub Actions minutes from the runs and jobs API.

          Usage: minutes --repo OWNER/NAME [--repo ...] (--since DAY [--until DAY] | --days N
                 [--today DAY] | --month-to-date [--today DAY] [--now TIME]) [--ledger FILE]
                 [--budget M --alert-percent P | --budget-usd B [--included-usd I] [--share S]
                 --alert-percent P[,P...]] [--issue] [--price LABEL=USD ...]
                 [--package NAME --storage-mb N] [--max-calls N]

          A job bills ceil(seconds / 60) minutes times its runner multiplier (Linux 1,
          Windows 2, macOS 10, self-hosted 0); skipped jobs bill 0; every attempt counts.
          A query over the 1,000-run cap is split. Calls use "gh api"; a failure other
          than HTTP 4xx is tried twice more. It never reads the billing API or runs "gh auth".
          --since/--until: UTC days (until defaults to yesterday). --days N: the N days
          before --today. --ledger keeps each run's count, so a later run counts only runs
          it does not have or that have a new attempt; a day is final once a count after it
          is 2 days old is complete. --max-calls N stops at about N calls and the next run
          goes on from there; a day not final and not counted complete in this run is in
          "missing" (the totals are then a lower bound). --budget
          adds a "budget" object; --issue opens or updates the first repo's issue "Actions
          minutes at the weekly alert level" at the alert level, and closes it when a
          complete count is below.
          --month-to-date counts the 1st of the month to today; today counts what has
          finished so far. Each job also costs its minutes times the price of its first
          label in USD a minute (--price LABEL=USD overrides; see PRICES); a label with
          no price is in "unpriced". --budget-usd B --share S --included-usd I: the
          repository's part of a monthly account budget is (B + I) * S, because the
          budget counts only spend above the included minutes. The alert level is the
          highest P that "percent" reaches; the forecast takes the spend so far to the
          end of the month at the same rate, and reaching 100 % adds "forecast" to the
          level ("50+forecast"), so a forecast past the budget always warns.
          The issue is then "Actions spend at a monthly alert level"; a higher level
          adds a comment, so it notifies. --package NAME adds the storage of every
          version of the owner's npm package NAME in GitHub Packages (from the registry
          with $GH_TOKEN), with an alert at the same levels of --storage-mb. Prints JSON. Exit 0; 4 at the alert level without
          --issue; 3 when an API error left no day counted or the issue update failed; 2 on
          usage errors.
          """
          import datetime as dt
          import json
          import math
          import os
          import re
          import subprocess
          import sys
          import time

          ISSUE_TITLE = "Actions minutes at the weekly alert level"
          MARK = "<!-- actions-minutes -->"
          USD_TITLE = "Actions spend at a monthly alert level"
          CAP = 1000
          # USD a minute, GitHub's hosted runner prices from 2026-01-01.
          PRICES = {"ubuntu-slim": 0.002, "linux": 0.006, "windows": 0.010, "macos": 0.062, "self-hosted": 0.0}
          SETTLE = 2  # days a re-run may still add jobs to a day's runs


          class ApiError(Exception):
              """A gh api call failed."""


          class Api:
              def __init__(self, max_calls):
                  self.calls = 0
                  self.max = max_calls

              def room(self, n):
                  return self.max is None or self.calls + n <= self.max

              def get(self, path, params=None):
                  cmd = ["gh", "api", "-X", "GET", path]
                  for k, v in (params or {}).items():
                      cmd += ["-f", f"{k}={v}"]
                  return self._run(cmd)

              def send(self, method, path, body):
                  return self._run(["gh", "api", "-X", method, path, "--input", "-"], json.dumps(body))

              def _run(self, cmd, data=None):
                  for attempt in range(3):
                      self.calls += 1
                      p = subprocess.run(cmd, input=data, capture_output=True, text=True)
                      if p.returncode == 0:
                          return json.loads(p.stdout) if p.stdout.strip() else {}
                      err = (p.stderr or p.stdout).strip()
                      if "(HTTP 4" in err or attempt == 2:
                          raise ApiError(f"gh api {cmd[4]}: {err[:300]}")
                      time.sleep(5 * (attempt + 1))


          def ts(s):
              return dt.datetime.fromisoformat(s.replace("Z", "+00:00"))


          def iso(t):
              return t.strftime("%Y-%m-%dT%H:%M:%SZ")


          def multiplier(labels):
              low = [str(x).lower() for x in labels or []]
              if "self-hosted" in low:
                  return 0
              if any(x.startswith("windows") for x in low):
                  return 2
              if any(x.startswith("macos") for x in low):
                  return 10
              return 1


          def raw(job):
              """The job's run time rounded up to a whole minute, before the multiplier."""
              if job.get("conclusion") == "skipped" or not job.get("started_at") or not job.get("completed_at"):
                  return 0
              s = (ts(job["completed_at"]) - ts(job["started_at"])).total_seconds()
              return 0 if s <= 0 else math.ceil(s / 60)


          def runner_of(job):
              """The label that prices a job: "self-hosted" when any label says so, else the first."""
              labels = [str(x) for x in job.get("labels") or []] or ["?"]
              return "self-hosted" if any(x.lower() == "self-hosted" for x in labels) else labels[0]


          def price(label, over):
              """USD a minute for a runner label, or None when no rule prices it."""
              low = str(label).lower()
              if label in over:
                  return over[label]
              if low == "self-hosted":
                  return PRICES["self-hosted"]
              if low.startswith("ubuntu-slim"):
                  return PRICES["ubuntu-slim"]
              for os_name, pre in (("windows", "windows-"), ("macos", "macos-"), ("linux", "ubuntu-")):
                  if re.fullmatch(re.escape(pre) + r"[0-9.]+(-arm)?|" + re.escape(pre) + "latest", low):
                      return PRICES[os_name]
              return None


          def list_runs(api, repo, start, end):
              """Every run created from start to end (inclusive), splitting a window over the cap."""
              q = {"created": f"{iso(start)}..{iso(end)}", "per_page": 100}
              first = api.get(f"/repos/{repo}/actions/runs", {**q, "page": 1})
              total = first.get("total_count", 0)
              if total > CAP:
                  if end - start <= dt.timedelta(minutes=1):
                      raise ApiError(f"over {CAP} runs from {iso(start)} to {iso(end)}")
                  mid = start + (end - start) / 2
                  mid = mid.replace(microsecond=0)
                  return list_runs(api, repo, start, mid) + list_runs(api, repo, mid + dt.timedelta(seconds=1), end)
              runs = list(first.get("workflow_runs", []))
              page = 1
              while len(runs) < total:
                  page += 1
                  got = api.get(f"/repos/{repo}/actions/runs", {**q, "page": page}).get("workflow_runs", [])
                  if not got:
                      break
                  runs += got
              return runs


          def list_jobs(api, repo, run_id):
              jobs, page = [], 0
              while True:
                  page += 1
                  r = api.get(f"/repos/{repo}/actions/runs/{run_id}/jobs", {"filter": "all", "per_page": 100, "page": page})
                  jobs += r.get("jobs", [])
                  if len(jobs) >= r.get("total_count", 0) or not r.get("jobs"):
                      return jobs


          def add(d, k, m, n=1):
              e = d.setdefault(k, [0, 0])
              e[0] += m
              e[1] += n


          def count_day(api, repo, day, prior, settled):
              """Counts a day's runs, reusing prior counts. Returns (runs, complete, stopped)."""
              start = dt.datetime.combine(day, dt.time(0, 0), dt.timezone.utc)
              runs = list_runs(api, repo, start, start + dt.timedelta(days=1, seconds=-1))
              done, complete = {}, True
              for run in runs:
                  rid, att = str(run["id"]), run.get("run_attempt")
                  p = prior.get(rid)
                  if p and (p["attempt"] == att if att is not None else settled):
                      done[rid] = p
                      continue
                  if run.get("status") != "completed":
                      complete = False
                      continue
                  if not api.room(1):
                      return done, False, True
                  wf, rows = run.get("name") or str(run.get("workflow_id")), []
                  jobs = list_jobs(api, repo, run["id"])
                  if any(j.get("status") not in (None, "completed") for j in jobs):
                      complete = False
                      continue
                  for job in jobs:
                      rows.append([wf, str(job.get("name")), runner_of(job), raw(job)])
                  done[rid] = {"attempt": att, "jobs": rows}
              return done, complete, False


          def day_total(runs, over):
              out = {"minutes": 0, "usd": 0.0, "runs": len(runs), "jobs": 0, "by_workflow": {}, "by_job": {}, "by_runner": {},
                     "unpriced": set()}
              for r in runs.values():
                  for wf, name, runner, n in r["jobs"]:
                      m = n * multiplier([runner])
                      p = price(runner, over)
                      if p is None:
                          out["unpriced"].add(runner)
                          p = PRICES["linux"]
                      out["minutes"] += m
                      out["usd"] += n * p
                      out["jobs"] += 1
                      add(out["by_workflow"], wf, m)
                      add(out["by_job"], f"{wf} / {name}", m)
                      add(out["by_runner"], runner, m)
              return out


          def merge(into, day):
              for k in ("minutes", "usd", "runs", "jobs"):
                  into[k] += day[k]
              into["unpriced"] |= day["unpriced"]
              for k in ("by_workflow", "by_job", "by_runner"):
                  for name, (m, n) in day[k].items():
                      add(into[k], name, m, n)


          def args_of(argv):
              a, repos, prices, i = {}, [], [], 0
              flags = {"--issue", "--month-to-date"}
              while i < len(argv):
                  k = argv[i]
                  if k in flags:
                      a[k] = True
                      i += 1
                      continue
                  if i + 1 >= len(argv):
                      raise ValueError(f"{k} needs a value")
                  if k == "--repo":
                      repos.append(argv[i + 1])
                  elif k == "--price":
                      prices.append(argv[i + 1])
                  else:
                      a[k] = argv[i + 1]
                  i += 2
              a["--repo"] = repos
              a["--price"] = {}
              for x in prices:
                  label, _, usd = x.partition("=")
                  a["--price"][label] = float(usd)
              return a


          def issue_body(res, repo):
              b = res["budget"]
              days = res["days"]
              lines = [MARK,
                       f"The {len(days)} complete UTC days from {days[0]} to {days[-1]} used **{res['minutes']:,}** billed "
                       f"Actions minutes in {repo}: **{b['percent']} %** of the weekly budget of {b['minutes']:,} minutes "
                       f"(alert at {b['alert_percent']} %).", "",
                       "| Day | Minutes |", "| --- | ---: |"]
              for d in days:
                  v = res["repos"][repo]["days"].get(d)
                  lines.append(f"| {d} | {'not counted' if v is None else f'{v:,}'} |")
              lines += ["", "| Top jobs | Minutes | Jobs |", "| --- | ---: | ---: |"]
              for j in res["top_jobs"]:
                  lines.append(f"| {j['job']} | {j['minutes']:,} | {j['jobs']} |")
              if res["partial"]:
                  lines += ["", "Some days were not counted, so the total is a lower bound."]
              run = os.environ.get("GITHUB_RUN_ID")
              lines += ["", "Each job counts its run time rounded up to a whole minute, times its runner multiplier."
                        + (f" Counted by run {run}." if run else "")]
              return "\n".join(lines)


          def usd_body(res, repo, level):
              b = res["budget"]
              days = res["days"]
              lines = [f"{MARK[:-4]} level={level} -->",
                       f"From {days[0]} to {res['now']} UTC, {repo} spent **${b['usd']:,.2f}** on Actions: "
                       f"**{b['percent']} %** of its part of the monthly budget, ${b['part_usd']:,.2f} "
                       f"(${b['budget_usd']:,.2f} plus ${b['included_usd']:,.2f} included, times {b['share']}). "
                       f"At this rate the month ends at **${b['forecast_usd']:,.2f}** ({b['forecast_percent']} %). "
                       f"Alert levels: {', '.join(str(p) for p in b['levels'])} %.", "",
                       "| Day | USD | Minutes |", "| --- | ---: | ---: |"]
              for d in days:
                  v = res["repos"][repo]["days"].get(d)
                  u = res["repos"][repo]["usd_days"].get(d)
                  lines.append(f"| {d} | " + ("not counted | |" if v is None else f"{u:,.2f} | {v:,} |"))
              lines += ["", "| Top jobs | Minutes | Jobs |", "| --- | ---: | ---: |"]
              for j in res["top_jobs"]:
                  lines.append(f"| {j['job']} | {j['minutes']:,} | {j['jobs']} |")
              pk = res.get("packages")
              if pk:
                  lines += ["", f"GitHub Packages: {pk['name']} stores {pk['mb']} MB in {pk['versions']} versions, "
                                f"{pk['percent']} % of {pk['storage_mb']} MB. Data transfer is not in the API, so it is not counted."]
              if res["partial"]:
                  lines += ["", "Some days were not counted, so the spend is a lower bound."]
              run = os.environ.get("GITHUB_RUN_ID")
              lines += ["", "Each job costs its run time rounded up to a whole minute times the price of its runner."
                        + (f" Counted by run {run}." if run else "")]
              return "\n".join(lines)


          def level_of(body):
              m = re.search(r"level=((?:[0-9.]+)?(?:\+?forecast)?)", body or "")
              return m.group(1) if m else None


          def rank(level):
              if not level:
                  return -1
              base = level.split("+")[0]
              return (0 if base == "forecast" else float(base)) + (0.5 if level.endswith("forecast") else 0)


          def update_usd_issue(api, res, repo):
              issues, page = [], 0
              while True:
                  page += 1
                  got = api.get(f"/repos/{repo}/issues", {"state": "open", "per_page": 100, "page": page})
                  issues += got
                  if len(got) < 100:
                      break
              mine = [i for i in issues if i.get("title") == USD_TITLE and "pull_request" not in i]
              level = res["budget"]["level"]
              if level is not None:
                  body = usd_body(res, repo, level)
                  if mine:
                      n = mine[0]["number"]
                      was = level_of(mine[0].get("body"))
                      api.send("PATCH", f"/repos/{repo}/issues/{n}", {"body": body})
                      if rank(level) > rank(was):
                          api.send("POST", f"/repos/{repo}/issues/{n}/comments",
                                   {"body": f"The spend reached the {level} level: ${res['budget']['usd']:,.2f}, "
                                            f"{res['budget']['percent']} % (forecast {res['budget']['forecast_percent']} %)."})
                          return {"action": "raised", "number": n, "level": level}
                      return {"action": "updated", "number": n, "level": level}
                  made = api.send("POST", f"/repos/{repo}/issues", {"title": USD_TITLE, "body": usd_body(res, repo, level)})
                  return {"action": "opened", "number": made.get("number"), "level": level}
              if mine and (res["partial"] or res["errors"]):
                  why = "some days were not counted" if res["partial"] else "a lookup failed: " + res["errors"][0][:200]
                  return {"action": "kept-open", "number": mine[0]["number"], "reason": why}
              if mine:
                  n = mine[0]["number"]
                  api.send("POST", f"/repos/{repo}/issues/{n}/comments",
                           {"body": f"The spend is ${res['budget']['usd']:,.2f}, {res['budget']['percent']} %, with a forecast of "
                                    f"{res['budget']['forecast_percent']} %: below every alert level. Closing."})
                  api.send("PATCH", f"/repos/{repo}/issues/{n}", {"state": "closed"})
                  return {"action": "closed", "number": n}
              return {"action": "none"}


          def package_storage(owner, name):
              """Bytes of every version of an npm package in GitHub Packages, from the registry."""
              tok = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN") or ""
              hdr = ["-H", f"Authorization: Bearer {tok}"] if tok else []
              p = subprocess.run(["curl", "-sfL", *hdr, f"https://npm.pkg.github.com/@{owner}%2f{name}"],
                                 capture_output=True, text=True)
              if p.returncode != 0:
                  raise ApiError(f"registry {name}: curl exit {p.returncode}")
              versions = json.loads(p.stdout).get("versions", {})
              total = 0
              for v in versions.values():
                  q = subprocess.run(["curl", "-sfL", "-o", "/dev/null", "-r", "0-0", "-D", "-", *hdr, v["dist"]["tarball"]],
                                     capture_output=True, text=True)
                  m = re.findall(r"(?im)^content-range: bytes [0-9-]+/([0-9]+)", q.stdout)
                  if q.returncode != 0 or not m:
                      raise ApiError(f"registry {name}: no size for a version")
                  total += int(m[-1])
              return len(versions), total


          def update_issue(api, res, repo):
              issues, page = [], 0
              while True:
                  page += 1
                  got = api.get(f"/repos/{repo}/issues", {"state": "open", "per_page": 100, "page": page})
                  issues += got
                  if len(got) < 100:
                      break
              mine = [i for i in issues if i.get("title") == ISSUE_TITLE and "pull_request" not in i]
              alert = res["budget"]["alert"]
              if alert:
                  body = issue_body(res, repo)
                  if mine:
                      api.send("PATCH", f"/repos/{repo}/issues/{mine[0]['number']}", {"body": body})
                      return {"action": "updated", "number": mine[0]["number"]}
                  made = api.send("POST", f"/repos/{repo}/issues", {"title": ISSUE_TITLE, "body": body})
                  return {"action": "opened", "number": made.get("number")}
              if mine and (res["partial"] or res["errors"]):
                  why = "some days were not counted" if res["partial"] else "a lookup failed: " + res["errors"][0][:200]
                  return {"action": "kept-open", "number": mine[0]["number"], "reason": why}
              if mine:
                  n = mine[0]["number"]
                  api.send("POST", f"/repos/{repo}/issues/{n}/comments",
                           {"body": f"The last {len(res['days'])} days used {res['minutes']:,} minutes, "
                                    f"{res['budget']['percent']} % of the budget, below the alert level. Closing."})
                  api.send("PATCH", f"/repos/{repo}/issues/{n}", {"state": "closed"})
                  return {"action": "closed", "number": n}
              return {"action": "none"}


          def main(argv):
              if not argv or argv[0] in ("-h", "--help"):
                  print(__doc__.strip())
                  return 0
              try:
                  a = args_of(argv)
                  repos = a["--repo"]
                  if not repos:
                      raise ValueError("give at least one --repo")
                  today = dt.date.fromisoformat(a["--today"]) if "--today" in a else dt.datetime.now(dt.timezone.utc).date()
                  if a.get("--month-to-date"):
                      days = [today.replace(day=1) + dt.timedelta(days=i) for i in range(today.day)]
                  elif "--days" in a:
                      n = int(a["--days"])
                      days = [today - dt.timedelta(days=n - i) for i in range(n)]
                  elif "--since" in a:
                      s = dt.date.fromisoformat(a["--since"])
                      u = dt.date.fromisoformat(a["--until"]) if "--until" in a else today - dt.timedelta(days=1)
                      days = [s + dt.timedelta(days=i) for i in range((u - s).days + 1)]
                  else:
                      raise ValueError("give --days or --since")
                  if not days:
                      raise ValueError("the window has no days")
                  max_calls = int(a["--max-calls"]) if "--max-calls" in a else None
                  budget = int(a["--budget"]) if "--budget" in a else None
                  usd = float(a["--budget-usd"]) if "--budget-usd" in a else None
                  levels = sorted(float(x) for x in str(a.get("--alert-percent", 80)).split(","))
                  pct = levels[0]
                  if a.get("--issue") and budget is None and usd is None:
                      raise ValueError("--issue needs --budget or --budget-usd")
                  if usd is not None and not a.get("--month-to-date"):
                      raise ValueError("--budget-usd needs --month-to-date")
                  now = dt.datetime.fromisoformat(a["--now"].replace("Z", "+00:00")) if "--now" in a else None
                  if now is None:
                      real = dt.datetime.now(dt.timezone.utc)
                      now = real if real.date() == today else dt.datetime.combine(today, dt.time(23, 59, 59), dt.timezone.utc)
                  if "--package" in a and "--storage-mb" not in a:
                      raise ValueError("--package needs --storage-mb")
              except ValueError as e:
                  print(json.dumps({"error": str(e)}))
                  return 2

              ledger_path = a.get("--ledger")
              ledger = {"version": 5, "days": {}}
              if ledger_path and os.path.exists(ledger_path):
                  try:
                      with open(ledger_path) as f:
                          have = json.load(f)
                      if have.get("version") == 5:
                          ledger = have
                  except (OSError, ValueError):
                      pass
              api = Api(max_calls)
              over = a["--price"]
              res = {"repos": {}, "minutes": 0, "usd": 0.0, "days": [d.isoformat() for d in days], "missing": [],
                     "partial": False, "errors": [], "now": iso(now)}
              stopped = False
              counted = 0
              for repo in repos:
                  tot = {"minutes": 0, "usd": 0.0, "runs": 0, "jobs": 0, "by_workflow": {}, "by_job": {}, "by_runner": {},
                         "days": {}, "usd_days": {}, "unpriced": set()}
                  kept = ledger["days"].setdefault(repo, {})
                  for d in days:
                      key = d.isoformat()
                      entry = kept.get(key) or {"complete": False, "final": False, "runs": {}}
                      settled = d < today - dt.timedelta(days=SETTLE)
                      fresh = False
                      cut = False
                      if not entry.get("final") and not stopped:
                          if not api.room(12):
                              stopped = True
                      if not entry.get("final") and not stopped:
                          try:
                              runs, complete, stopped = count_day(api, repo, d, entry["runs"], settled)
                              cut = stopped
                              complete = complete and d < today
                              entry = {"complete": complete, "final": complete and settled, "runs": runs}
                              kept[key] = entry
                              counted += 1
                              fresh = True
                          except ApiError as e:
                              res["errors"].append(str(e))
                              stopped = True
                      # Today may hold runs still in progress, but a count that stopped at
                      # --max-calls on it is missing, like any other day.
                      if not (entry.get("final") or (fresh and (entry["complete"] or (d == today and not cut)))):
                          res["missing"].append({"repo": repo, "day": key})
                      if key in kept:
                          day = day_total(entry["runs"], over)
                          merge(tot, day)
                          tot["days"][key] = day["minutes"]
                          tot["usd_days"][key] = round(day["usd"], 2)
                  tot["usd"] = round(tot["usd"], 2)
                  tot["unpriced"] = sorted(tot["unpriced"])
                  res["repos"][repo] = tot
                  res["minutes"] += tot["minutes"]
                  res["usd"] = round(res["usd"] + tot["usd"], 2)
                  oldest = (today - dt.timedelta(days=35)).isoformat()
                  for k in [k for k in kept if k < oldest]:
                      del kept[k]
              res["partial"] = bool(res["missing"])
              top = []
              for repo, tot in res["repos"].items():
                  for name, (m, n) in tot["by_job"].items():
                      top.append({"repo": repo, "job": name, "minutes": m, "jobs": n})
                  for k in ("by_workflow", "by_job", "by_runner"):
                      tot[k] = {name: {"minutes": m, "jobs": n} for name, (m, n) in sorted(tot[k].items(), key=lambda x: -x[1][0])}
              res["top_jobs"] = sorted(top, key=lambda x: -x["minutes"])[:10]
              for tot in res["repos"].values():
                  tot["by_job"] = dict(list(tot["by_job"].items())[:20])
              res["calls"] = api.calls
              if ledger_path:
                  with open(ledger_path, "w") as f:
                      json.dump(ledger, f)
              code = 0
              if "--package" in a:
                  try:
                      n, b = package_storage(repos[0].split("/")[0], a["--package"])
                      cap = float(a["--storage-mb"])
                      mb = round(b / 1e6, 1)
                      res["packages"] = {"name": a["--package"], "versions": n, "mb": mb, "storage_mb": cap,
                                         "percent": round(mb * 100 / cap, 1) if cap else 0}
                  except (ApiError, ValueError, KeyError) as e:
                      res["errors"].append(str(e))
                      res["packages"] = {"name": a["--package"], "error": str(e)}
              if usd is not None:
                  inc = float(a.get("--included-usd", 0))
                  share = float(a.get("--share", 1))
                  part = (usd + inc) * share
                  start = dt.datetime.combine(days[0], dt.time(0, 0), dt.timezone.utc)
                  nxt = (days[0].replace(day=28) + dt.timedelta(days=4)).replace(day=1)
                  month = (dt.datetime.combine(nxt, dt.time(0, 0), dt.timezone.utc) - start).total_seconds()
                  gone = max((now - start).total_seconds(), 3600)
                  fc = res["usd"] * month / gone
                  p = round(res["usd"] * 100 / part, 1) if part else 0
                  fp = round(fc * 100 / part, 1) if part else 0
                  pk = res.get("packages", {}).get("percent") or 0
                  hit = [x for x in levels if p >= x or pk >= x]
                  level = f"{hit[-1]:g}" if hit else None
                  if fp >= 100:
                      level = f"{level}+forecast" if level else "forecast"
                  res["budget"] = {"budget_usd": usd, "included_usd": inc, "share": share, "part_usd": round(part, 2),
                                   "usd": res["usd"], "percent": p, "forecast_usd": round(fc, 2), "forecast_percent": fp,
                                   "levels": [f"{x:g}" for x in levels], "level": level, "alert": level is not None,
                                   "lower_bound": res["partial"]}
                  if a.get("--issue"):
                      try:
                          res["issue"] = update_usd_issue(api, res, repos[0])
                      except ApiError as e:
                          res["errors"].append(str(e))
                          code = 3
                  elif level is not None:
                      code = 4
              elif budget is not None:
                  p = round(res["minutes"] * 100 / budget, 1) if budget else 0
                  res["budget"] = {"minutes": budget, "alert_percent": pct, "percent": p,
                                   "alert": res["minutes"] >= budget * pct / 100, "lower_bound": res["partial"]}
                  if a.get("--issue"):
                      try:
                          res["issue"] = update_issue(api, res, repos[0])
                      except ApiError as e:
                          res["errors"].append(str(e))
                          code = 3
                  elif res["budget"]["alert"]:
                      code = 4
              if res["errors"] and counted == 0 and not any(res["repos"][r]["days"] for r in repos):
                  code = 3
              print(json.dumps(res, indent=1))
              return code


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          MINUTES
          python3 "$RUNNER_TEMP/minutes" --repo "$GITHUB_REPOSITORY" --month-to-date \
            --ledger actions-minutes-ledger.json --budget-usd 300 \
            --included-usd 12 --share 0.55 \
            --alert-percent 50,80 --max-calls 800 --issue

      - name: Save the ledger of counted days
        if: always() && hashFiles('actions-minutes-ledger.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: actions-minutes-ledger.json
          key: actions-minutes-${{ github.run_id }}
