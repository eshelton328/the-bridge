name: ci

on:
  # Only a change to the code runs these checks. A title edit runs pr.yml
  # (pr-title) instead, as in the library: an edit reran every job here on
  # a commit that had already passed.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Runs every job, with the fidelity job, on a branch by hand.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides what this run must do and fails open: when it cannot show that
  # a job need not run, or fails itself, every job runs.
  # - A push to main skips every job when the main commit's tree is the
  #   tree of the head of a PR merged into main whose ci run passed: the
  #   squash merge of an up-to-date PR (protect-main) adds no code that
  #   the PR's checks did not run on.
  # - On a PR, fidelity is false when scripts/ciPlan.ts finds no changed
  #   file that can change the fidelity result (only Markdown outside web/,
  #   references/ and scripts/fidelity/, or scripts that neither the
  #   fidelity scripts nor the web build import). The
  #   fidelity jobs then pass without their steps, so the required checks
  #   still report; main passed them, and none of their inputs changed.
  #   A push to main and a run by hand always run fidelity.
  plan:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # the PR of a main commit, and a PR's files
      actions: read # the ci runs of a PR head
    outputs:
      skip: ${{ steps.push.outputs.skip }}
      fidelity: ${{ steps.files.outputs.fidelity }}
    steps:
      - id: push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree=$(gh api "repos/$GH_REPO/git/commits/$SHA" --jq .tree.sha)
          heads=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null and .base.ref == "main") | .head.sha')
          for head in $heads; do
            if [ "$(gh api "repos/$GH_REPO/git/commits/$head" --jq .tree.sha)" != "$tree" ]; then continue; fi
            passed=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" --jq .total_count)
            if [ "$passed" -gt 0 ]; then
              echo "::notice::main $SHA has the tree of PR head $head, whose ci run passed; no job runs again."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice::No passed PR head has the tree of main $SHA; every job runs."
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            web
      - id: files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          # The API lists at most 3000 files; with that many, run fidelity.
          if [ "$(wc -l < "$RUNNER_TEMP/changed.txt")" -ge 3000 ]; then
            echo "fidelity=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          plan=$(node scripts/ciPlan.ts < "$RUNNER_TEMP/changed.txt")
          echo "::notice::fidelity plan: $plan"
          echo "fidelity=$(jq -r .fidelity <<< "$plan")" >> "$GITHUB_OUTPUT"

  # Each check is its own job, so a PR shows which one failed. pnpm verify
  # runs the same commands in one go on a laptop.
  typecheck:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm codegen
      - run: pnpm check:routes
      - run: pnpm check:registry
      - run: pnpm typecheck

  lint:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm codegen
      # panda cssgen with no warning allowed; web/panda.config.ts sets validation: 'error' (audit G-3).
      - run: pnpm check:css
      # Type-aware ESLint over the whole workspace ran out of Node's default heap (about 2 GB) on 2026-11-17
      # and of a 4 GB heap on 2026-11-19 (#157, run 44458177294). In a Linux container with 2 CPUs and
      # 7 GB, its peak resident memory was 4.33 GB on main and 4.43 GB with #157. A 6 GB heap leaves
      # the runner's OS about 1 GB. Memory only: no rule or file changes.
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm format:check
      - run: pnpm knip

  checks:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
          browser: "true"
      - run: pnpm check:agents-md
      - run: pnpm check:cycles
      - run: pnpm check:structure
      - run: pnpm check:states
      - run: pnpm check:reviews
      - run: pnpm check:ci
      - run: pnpm test:scripts

  # The 2-vCPU runner gives Vitest one worker, so test:unit runs one file
  # at a time, and Chromium's renderer for that file keeps both vCPUs busy
  # (in a 2-CPU container it held 167-191 % for a whole shard; the Vitest
  # node process about 8 %). VITEST_SHARD adds --shard to the script, and
  # the sequencer in scripts/testSequencer.ts splits the files by their CI
  # times, here from runs 44625576662, 44624538189 and 44623880932 (801 s
  # of files). In those runs two shards took 480 to 594 s a job (8 to 10
  # billed minutes, 18 to 20 in all). Three shards (PR 252, run 44631056239) took
  # 403 to 426 s a job, 21 billed minutes in all: each file also pays a
  # start-up cost, so a third shard costs more and gives a file no more CPU.
  test-unit-shard:
    name: test-unit (${{ matrix.shard }}/2)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
          browser: "true"
      - run: pnpm codegen
      # Two test files at a time, not three: the runner has 4 vCPU, and with
      # three Chromium pages a slow host held single clicks for 5 to 7 s
      # (the-bridge #322). Local runs keep Vitest's default.
      - run: pnpm test:unit
        env:
          VITEST_SHARD: ${{ matrix.shard }}/2
          VITEST_MAX_WORKERS: "2"

  # The required check: it passes only when every test:unit shard passed.
  # It reads one result, so ubuntu-slim (1 vCPU container) is enough.
  test-unit:
    needs: [plan, test-unit-shard]
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Require every test:unit shard to pass
        env:
          RESULT: ${{ needs.test-unit-shard.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::A test:unit shard did not pass (result: $RESULT)."
            exit 1
          fi

  test-stories:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
          browser: "true"
      - run: pnpm codegen
      - run: pnpm test:stories

  # The fidelity TEXT and RULES checks of every frame of the four pages
  # (scripts/fidelity/AGENTS.md): each Figma string is in the render and
  # seen, no extra text, no clipped text, no scroll bar, full height.
  # POSITION is left out until frames pass it. No image is compared: the
  # side-by-side PNGs are uploaded for a reviewer only. Every frame passed
  # on main f83cc7db (run 44487438612), so the job runs on each PR too, and
  # its page jobs are required checks of the protect-main ruleset. Inbox
  # joined the PR runs after PR 197 made the fidelity script wait for a
  # stable layout, which fixed its T12 textarea flake on Linux.
  fidelity:
    name: fidelity (${{ matrix.page }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        page: [inbox, workspaces, artifacts, toolkit]
    # With no fidelity input changed, the job only reports; ubuntu-slim does that for less.
    runs-on: ${{ needs.plan.outputs.fidelity == 'false' && 'ubuntu-slim' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      # The pages whose icon sizes the job gates too (--checks icons: no
      # iconSize diff in the position check). A page joins when it has none.
      ICON_GATED_PAGES: '["inbox", "workspaces", "artifacts", "toolkit"]'
    steps:
      - if: needs.plan.outputs.fidelity == 'false'
        run: echo "::notice::No changed file can change the fidelity result (plan job); the check passes without a run."
      - if: needs.plan.outputs.fidelity != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.plan.outputs.fidelity != 'false'
        uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
          browser: "true"
      - if: needs.plan.outputs.fidelity != 'false'
        run: pnpm codegen
      - if: needs.plan.outputs.fidelity != 'false'
        run: pnpm build-storybook
      - if: needs.plan.outputs.fidelity != 'false'
        run: pnpm fidelity ${{ matrix.page }} --skip-build --checks ${{ contains(fromJSON(env.ICON_GATED_PAGES), matrix.page) && 'text,rules,icons' || 'text,rules' }}
      - if: ${{ !cancelled() && needs.plan.outputs.fidelity != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fidelity-${{ matrix.page }}
          path: reports/fidelity/${{ matrix.page }}/
          retention-days: 7

  build:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm codegen
      - run: pnpm build
      - run: pnpm build:canvas
      - run: pnpm build-storybook

  # Secrets and private values in the commits of this PR (gitleaks 8.30.1,
  # rules in .gitleaks.toml), as in the library. Personal values come from
  # the secret PRIVACY_TERMS, so they are never in the repository. The
  # pre-commit hook runs the same scan earlier, but a hook can be skipped;
  # this job is the gate. ubuntu-slim has Node 24, so no setup is needed.
  # --diff-merges=remerge shows what a merge commit changed beyond git's own
  # merge, such as a conflict resolution, which git log -p leaves out.
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      # The rule tests run gitleaks on planted lines; they need no packages.
      - name: Test the scan rules
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
        run: node --test scripts/secrets/secretScan.test.ts
      # The path exceptions also match b/<path> (a merge conflict hunk), so no
      # real file may sit under a top-level b/ folder.
      - name: No files under b/
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/secrets/mergePrefix.ts "$BASE" "$HEAD"
      - name: Scan the commits of this PR
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A missing secret would turn the personal check off, so it fails.
          if [ -z "$PRIVACY_TERMS" ]; then echo "::error::the secret PRIVACY_TERMS is missing"; exit 1; fi
          alt="$(printf '%s\n' "$PRIVACY_TERMS" | grep -v '^[[:space:]]*#' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' | sed 's/[][\\.*^$+?(){}|/]/\\&/g' | paste -sd '|' -)"
          cfg="$RUNNER_TEMP/gitleaks.toml"
          cat .gitleaks.toml > "$cfg"
          printf '\n[[rules]]\nid = "personal-term"\ndescription = "A value from the secret PRIVACY_TERMS"\n' >> "$cfg"
          printf "regex = '''(?i)\\\\b(?:%s)\\\\b'''\n" "$alt" >> "$cfg"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --ignore-gitleaks-allow --config "$cfg" --log-opts="--diff-merges=remerge $BASE..$HEAD" .
