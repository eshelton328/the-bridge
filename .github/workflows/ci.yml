name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Runs every job, with the fidelity job, on a branch by hand.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each check is its own job, so a PR shows which one failed. pnpm verify
  # runs the same commands in one go on a laptop.
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm codegen
      - run: pnpm check:routes
      - run: pnpm check:registry
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm codegen
      # Type-aware ESLint over the whole workspace peaks near Node's default heap of about 2 GB, and ran out of
      # it on 2026-11-17; 4 GB gives it room on the runner. Memory only: no rule or file changes.
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm format:check
      - run: pnpm knip

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
          browser: "true"
      - run: pnpm check:agents-md
      - run: pnpm check:cycles
      - run: pnpm check:structure
      - run: pnpm check:states
      - run: pnpm check:ci
      - run: pnpm test:scripts

  # The 2-vCPU runner gives Vitest one worker, so test:unit runs one file
  # at a time (328 s in main run 44421912057). It runs in three shards
  # here; VITEST_SHARD adds --shard to the script, and the sequencer in
  # scripts/testSequencer.ts splits the files by their CI times. With two
  # shards the slower one took 252 s and its job 317 s, longer than
  # test-stories; each shard's setup is about 65 s.
  test-unit-shard:
    name: test-unit (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
          browser: "true"
      - run: pnpm codegen
      - run: pnpm test:unit
        env:
          VITEST_SHARD: ${{ matrix.shard }}/3

  # The required check: it passes only when every test:unit shard passed.
  test-unit:
    needs: test-unit-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test:unit shard to pass
        env:
          RESULT: ${{ needs.test-unit-shard.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::A test:unit shard did not pass (result: $RESULT)."
            exit 1
          fi

  test-stories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
          browser: "true"
      - run: pnpm codegen
      - run: pnpm test:stories

  # The fidelity TEXT and RULES checks of every frame of the four pages
  # (scripts/fidelity/AGENTS.md): each Figma string is in the render and
  # seen, no extra text, no clipped text, no scroll bar, full height.
  # POSITION is left out until frames pass it. No image is compared: the
  # side-by-side PNGs are uploaded for a reviewer only. Frames on main
  # still fail these checks, and ship-pr stops on any red check, so until
  # this job passes on main it runs only on a push to main and by hand.
  # Then it runs on each PR and becomes a required check.
  fidelity:
    if: github.event_name != 'pull_request'
    name: fidelity (${{ matrix.page }})
    strategy:
      fail-fast: false
      matrix:
        page: [inbox, workspaces, artifacts, toolkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
          browser: "true"
      - run: pnpm codegen
      - run: pnpm build-storybook
      - run: pnpm fidelity ${{ matrix.page }} --skip-build --checks text,rules
        env:
          FIDELITY_DEBUG: "1"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fidelity-${{ matrix.page }}
          path: reports/fidelity/${{ matrix.page }}/
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm codegen
      - run: pnpm build
      - run: pnpm build:canvas
      - run: pnpm build-storybook

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check the title is a Conventional Commits header
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z].*[^.]$'
          if ! [[ "$TITLE" =~ $re ]] || [ ${#TITLE} -gt 72 ]; then
            echo "::error::The PR title becomes the squash commit header. Use 'type(scope): description', lowercase, imperative, at most 72 characters, no final period."
            exit 1
          fi
