# Weekly scan of the full git history for secrets and private values
# (gitleaks 8.30.1, rules in .gitleaks.toml plus the secret PRIVACY_TERMS).
# --diff-merges=remerge adds what each merge commit changed beyond git's
# own merge (a conflict resolution); --all is gitleaks' default range.
# It opens or updates the issue "Secret scan of the full history" with each
# finding's rule, file, line and commit, never the value, and closes the
# issue when the history is clean.
name: secret-history

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: secret-history
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history and update the issue
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$PRIVACY_TERMS" ]; then echo "::error::the secret PRIVACY_TERMS is missing"; exit 1; fi
          alt="$(printf '%s\n' "$PRIVACY_TERMS" | grep -v '^[[:space:]]*#' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' | sed 's/[][\\.*^$+?(){}|/]/\\&/g' | paste -sd '|' -)"
          cfg="$RUNNER_TEMP/gitleaks.toml"
          cat .gitleaks.toml > "$cfg"
          printf '\n[[rules]]\nid = "personal-term"\ndescription = "A value from the secret PRIVACY_TERMS"\n' >> "$cfg"
          printf "regex = '''(?i)\\\\b(?:%s)\\\\b'''\n" "$alt" >> "$cfg"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 0 --ignore-gitleaks-allow --config "$cfg" \
            --log-opts="--all --diff-merges=remerge" \
            --report-format json --report-path "$RUNNER_TEMP/report.json" .
          python3 - "$RUNNER_TEMP/report.json" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" <<'PY'
          import json, subprocess, sys
          report, repo, run = sys.argv[1:4]
          found = json.load(open(report))
          title = "Secret scan of the full history"
          def gh(*a, body=None):
              return subprocess.run(["gh", *a], input=body, capture_output=True, text=True, check=True).stdout
          mine = [i for i in json.loads(gh("issue", "list", "-R", repo, "--state", "open", "--search", title,
                                           "--json", "number,title", "--limit", "100")) if i["title"] == title]
          if found:
              rows = sorted({(f["RuleID"], f["File"], f["StartLine"], f["Commit"][:10]) for f in found})
              lines = [f"Run {run} found {len(rows)} findings in the full history. The values are not shown.", "",
                       "| Rule | File | Line | Commit |", "| --- | --- | ---: | --- |"]
              lines += [f"| {r} | `{p}` | {n} | {c} |" for r, p, n, c in rows[:300]]
              if len(rows) > 300:
                  lines.append(f"| ... | {len(rows) - 300} more | | |")
              body = "\n".join(lines)
              if mine:
                  gh("issue", "edit", str(mine[0]["number"]), "-R", repo, "--body-file", "-", body=body)
              else:
                  gh("issue", "create", "-R", repo, "--title", title, "--body-file", "-", body=body)
              print(f"{len(rows)} findings")
          elif mine:
              gh("issue", "close", str(mine[0]["number"]), "-R", repo, "--comment", f"Run {run} found no finding.")
              print("clean; closed the issue")
          else:
              print("clean")
          PY
