name: runner pilot

# The pilot of the self-hosted runner on the owner's Mac (brain:
# engine/projects/ncc-1701/toolkit/runner/): test:unit and test:stories run
# there too, beside ci.yml, so their times and results can be compared.
# Fidelity is not here: on arm64, inbox frames M12 and M25 failed the text
# check (run 44646326424), so it stays on x64 until that is explained. No check
# here is required, and ci.yml does not change. Jobs run only for a PR from
# a branch of this repository (no fork code) while the repository is
# private; each has a read-only token and a time limit.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: runner-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  pilot-test-unit:
    name: pilot test-unit
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.repository.private
    runs-on: [self-hosted, linux, arm64, mac]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The image has Chromium (PLAYWRIGHT_BROWSERS_PATH) and its packages,
      # and the pnpm store is on the runner's cache volume, so no setup action.
      - run: echo "//npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}" >> "$HOME/.npmrc"
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      # Two CPUs for each worker, as on a 2-vCPU GitHub runner with one worker.
      - run: pnpm test:unit --maxWorkers=3

  pilot-test-stories:
    name: pilot test-stories
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.repository.private
    runs-on: [self-hosted, linux, arm64, mac]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The image has Chromium (PLAYWRIGHT_BROWSERS_PATH) and its packages,
      # and the pnpm store is on the runner's cache volume, so no setup action.
      - run: echo "//npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}" >> "$HOME/.npmrc"
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm test:stories
