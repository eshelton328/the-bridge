name: setup
description: Install pnpm, Node 24 and the locked dependencies, and optionally Chromium.
inputs:
  browser:
    description: Install Chromium for the Vitest browser and story tests and the script tests.
    default: "false"
  packages-token:
    description: A token that can read the component library from GitHub Packages.
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    # The library is a private package on GitHub Packages
    # (pnpm-workspace.yaml routes @eshelton328 there).
    - run: echo "//npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}" >> "$HOME/.npmrc"
      shell: bash
      env:
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Chromium and the system packages it needs. The apt mirror is
    # sometimes slow (32 MB in 5 min 36 s in library run 44423292766), so
    # the browser and the .deb files apt fetched are cached per runner image
    # and Playwright version. A cache hit installs the same .deb files with
    # dpkg and downloads nothing; a miss installs as before and saves them.
    - if: inputs.browser == 'true'
      id: playwright
      shell: bash
      run: echo "key=playwright-${ImageOS}-${ImageVersion}-${RUNNER_ARCH}-$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - if: inputs.browser == 'true'
      id: playwright-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/playwright-debs
        key: ${{ steps.playwright.outputs.key }}
    - if: inputs.browser == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        sudo dpkg -i ~/.cache/playwright-debs/*.deb
        pnpm exec playwright install chromium
    - if: inputs.browser == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      id: playwright-install
      shell: bash
      run: |
        pnpm exec playwright install --with-deps chromium
        mkdir -p ~/.cache/playwright-debs
        cp /var/cache/apt/archives/*.deb ~/.cache/playwright-debs/ 2>/dev/null || true
        if compgen -G "$HOME/.cache/playwright-debs/*.deb" > /dev/null; then echo "save=true" >> "$GITHUB_OUTPUT"; fi
    - if: steps.playwright-install.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/playwright-debs
        key: ${{ steps.playwright.outputs.key }}
